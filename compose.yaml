# Production stack. Caddy is the only thing bound to the host; the reflector is
# reachable only on the compose network.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:?set it in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - reflector

  reflector:
    build: .
    image: github-reflector:latest
    # Must be able to write ./logs and ./queue: set it to `id -u`:`id -g` of
    # the user that cloned the repository.
    user: "1000:1000"
    restart: unless-stopped
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set it in .env}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?set it in .env}
      LISTEN_ADDR: ":8080"
      LOG_DIR: /var/log/reflector
      IGNORE_JOB_NAMES: "${IGNORE_JOB_NAMES:-}"
      IGNORE_CHECK_APPS: "${IGNORE_CHECK_APPS:-}"
      DISCORD_ENABLED: "${DISCORD_ENABLED:-1}"
      IGNORE_WORKFLOWS: "${IGNORE_WORKFLOWS:-}"
      ONLY_WORKFLOWS: "${ONLY_WORKFLOWS:-}"
      FORWARD_SUCCESS: "${FORWARD_SUCCESS:-0}"
      FORWARD_CHECK_SUITE: "${FORWARD_CHECK_SUITE:-0}"
      IGNORE_CONCLUSIONS: "${IGNORE_CONCLUSIONS:-}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      QUEUE_DIR: /var/queue
      RETRY_WINDOW_HOURS: "${RETRY_WINDOW_HOURS:-24}"
      DELIVERED_RETENTION_HOURS: "${DELIVERED_RETENTION_HOURS:-6}"
      QUEUE_RETENTION_DAYS: "${QUEUE_RETENTION_DAYS:-7}"
      LOG_SKIPPED: "${LOG_SKIPPED:-1}"
      SKIPPED_RETENTION_MINUTES: "${SKIPPED_RETENTION_MINUTES:-60}"
    volumes:
      - ./logs:/var/log/reflector
      - ./queue:/var/queue
    expose:
      - "8080"

volumes:
  caddy_data:
  caddy_config:
